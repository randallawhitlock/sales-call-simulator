name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Case, mode (text or voice), and the steps. A session id helps if you have one.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Call screen / UI
        - AI customer behavior
        - Plan research data
        - Grading / debrief
        - Voice
        - Setup / tooling
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser, commit hash.
